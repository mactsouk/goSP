services:
  # Init container: Formats the data file
  tigerbeetle-init:
    image: ghcr.io/tigerbeetle/tigerbeetle:latest
    # FIX: We must grant the same security privileges to the init container
    # because 'format' also initializes the storage engine.
    security_opt:
      - seccomp:unconfined
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
    entrypoint: >
      sh -c "if [ ! -f /data/0_0.tigerbeetle ]; then 
      ./tigerbeetle format --cluster=0 --replica=0 --replica-count=1 /data/0_0.tigerbeetle; 
      echo 'Formatted data file.'; 
      else echo 'Data file already exists.'; fi"
    volumes:
      - ./data:/data

  # Main container: Runs the server
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:latest
    depends_on:
      tigerbeetle-init:
        condition: service_completed_successfully
    # FIX: Disable seccomp to allow io_uring
    security_opt:
      - seccomp:unconfined
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
    command: start --addresses=0.0.0.0:3000 /data/0_0.tigerbeetle
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
